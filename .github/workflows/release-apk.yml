name: Build and Release GoodDroid V1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # SDK komponentləri və lisenziyaların avtomatik quraşdırılması
          sdk-version: '34'
          build-tools-version: '34.0.0'
          platforms: 'platforms;android-34'

      - name: Create Web-based Android Wrapper Structure
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html app/src/main/assets/www/index.html

          # AndroidManifest.xml
          cat << 'EOT' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.gooddroid.v1">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="GoodDroid V1"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT

          # MainActivity.java
          mkdir -p app/src/main/java/com/gooddroid/v1
          cat << 'EOT' > app/src/main/java/com/gooddroid/v1/MainActivity.java
          package com.gooddroid.v1;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/www/index.html");
                  setContentView(webView);
              }
          }
          EOT

          # Gradle Konfiqurasiyaları
          echo "plugins { id 'com.android.application' }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" > settings.gradle
          echo "include ':app'" >> settings.gradle

          cat << 'EOT' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              defaultConfig {
                  applicationId "com.gooddroid.v1"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOT

          gradle wrapper

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create Git Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: GoodDroid V1
          body: "GoodDroid V1 - 35 dil dəstəyi, GoodDroid Defender modulu və VMOS daxili izolyasiyası ilə."
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
